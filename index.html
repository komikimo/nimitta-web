<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1017" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>Nimitta</title>
<!--
  Nimitta, web test instrument for Phase 0. One file, no dependencies, everything stored in this browser.
  Copy is verbatim from the specs (PRD, UX spec, Dhamma Framework, Decisions Log, revision R1–R6) except the strings
  marked NOT-IN-SPEC below, which exist only because a browser needs them.
  The score is the integer formula of PracticeScore.swift; ?selftest=1 checks it against the shared 20-week fixture,
  and tools/check_web_score.mjs does the same in CI.
-->
<style>
:root{
  --bg:#FAF9F6;--surface:#FFFFFF;--ink:#0E1B2A;--ink2:#4A5A6B;--ink3:#8B98A5;--line:#E4E1DA;
  --accent:#12355B;--accent2:#2F6FB2;--accentwash:#EAF0F7;--gold:#B8912F;--goldwash:#F3ECD9;
  --session:#05080C;--session-line:#1A2836;
  --serif:"New York",ui-serif,"Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --screen:320ms;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0A1017;--surface:#121B26;--ink:#EDEAE3;--ink2:#9DAAB8;--ink3:#65737F;--line:#1E2A38;
    --accent:#7FB0E0;--accent2:#4E8CC4;--accentwash:#16273A;--gold:#D9B64E;--goldwash:#2A2414}
}
/* Colour themes (D10.2): only the accent family changes. Gold and the session screen never do. */
:root[data-theme="jade"]{--accent:#0F4C3A;--accent2:#2E7D63;--accentwash:#E6F1EC}
:root[data-theme="onyx"]{--accent:#1C1C1E;--accent2:#4A4A4F;--accentwash:#EEEDEA}
@media (prefers-color-scheme:dark){
  :root[data-theme="jade"]{--accent:#7CC7A8;--accent2:#4FA584;--accentwash:#13281F}
  :root[data-theme="onyx"]{--accent:#D8D4CC;--accent2:#969089;--accentwash:#1F1E1C}
}
/* A theme change cross-fades over the screen transition, 320ms (150ms under Reduce Motion). */
html.theming *,html.theming *::before,html.theming *::after{transition:background-color var(--screen) ease-in-out,color var(--screen) ease-in-out,border-color var(--screen) ease-in-out,fill var(--screen) ease-in-out,stroke var(--screen) ease-in-out!important}
@media (prefers-reduced-motion:reduce){:root{--screen:150ms}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none;min-height:100vh;min-height:100dvh}
html.sitting,html.sitting body{background:var(--session);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
#app.no-tabs{padding-bottom:env(safe-area-inset-bottom)}

/* Type roles (UX spec §3) */
.display{font-family:var(--serif);font-size:34px;font-weight:400;letter-spacing:-.4px;line-height:1.15}
.title{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:-.2px;line-height:1.25}
.reading{font-family:var(--serif);font-size:19px;line-height:1.55}
.ui{font-size:16px;font-weight:500}
.secondary{font-size:14px}
.caption{font-size:12px;letter-spacing:.2px;color:var(--ink3);line-height:1.4}
.score{font-size:64px;font-weight:300;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.ink2{color:var(--ink2)}.ink3{color:var(--ink3)}.gold{color:var(--gold)}
.num{font-variant-numeric:tabular-nums}

/* Pieces */
.pad{padding:24px 24px 32px}
.hairline{height:1px;background:var(--line)}
.primary{display:block;width:100%;height:52px;border-radius:8px;background:var(--accent);color:var(--bg);font-size:16px;font-weight:500}
.primary:active{opacity:.85}
.outline{display:block;width:100%;height:52px;border-radius:8px;border:1px solid var(--line);font-size:16px;font-weight:500;color:var(--ink)}
.textlink{color:var(--accent2);font-size:14px;padding:6px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.label{font-size:14px;color:var(--ink2);margin-bottom:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-width:44px;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--accentwash);border-color:var(--accentwash)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:36px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.chips button.on{background:var(--accentwash);border-color:var(--accentwash)}
.options button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 12px;text-align:left;font-size:16px;font-weight:500}
.options button+button{border-top:1px solid var(--line)}
.options button.on{background:var(--accentwash)}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink3);flex:none;position:relative}
.on .radio{border-color:var(--ink)}
.on .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch.on{background:var(--accent2)}.switch.on::after{left:22px}
.field{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
textarea.field{height:110px;padding:10px 12px;resize:vertical;line-height:1.4}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--ink2);cursor:pointer}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--accent2)}
.empty{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;color:var(--ink2)}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-12px}

/* Onboarding */
.onb{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:12px 24px 24px}
.onb-top{display:flex;align-items:center;gap:16px;height:36px}
.progress{flex:1;display:flex;gap:6px}
.progress i{flex:1;height:2px;background:var(--line)}
.progress i.on{background:var(--accent)}
.skip{font-size:14px;color:var(--ink3);padding:8px 0}
.onb-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px 0}
.onb-body.top{justify-content:flex-start}
.onb-foot{display:flex;flex-direction:column;gap:12px;align-items:center}

/* Sit */
.sit{display:flex;flex-direction:column;min-height:calc(100dvh - 64px - env(safe-area-inset-bottom) - env(safe-area-inset-top));padding:24px 24px 16px}
.sit .middle{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:170px}
.arc-btn{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.arc-btn svg{position:absolute;inset:0}
.menu{position:absolute;top:calc(50% + 66px);left:50%;transform:translateX(-50%);width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:5}
.menu button{display:flex;justify-content:space-between;width:100%;height:44px;padding:0 16px;align-items:center;font-size:16px;font-variant-numeric:tabular-nums}
.menu button+button{border-top:1px solid var(--line)}
.anchor{font-family:var(--serif);font-size:17px;line-height:1.45;color:var(--ink2);text-align:center;margin:0 4px}
.cue{font-size:12px;letter-spacing:.2px;line-height:1.4;color:var(--ink3);text-align:center;margin:6px 4px 16px}
.arc-num{display:flex;flex-direction:column;align-items:center;line-height:1}
.arc-num b{font-family:var(--serif);font-size:48px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.arc-num small{font-size:12px;color:var(--ink3);margin-top:2px}
.postures{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:-8px 0 28px}
.postures button{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.postures button.on{background:var(--accentwash);border-color:var(--accentwash)}
.today-line{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;font-size:14px;color:var(--ink2)}
.today-line span:last-child{color:var(--ink3)}

/* Tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;border-top:1px solid var(--line);background:var(--bg);padding:6px 0 env(safe-area-inset-bottom);z-index:10}
#tabbar button{flex:1;max-width:240px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:var(--ink3)}
#tabbar button.on{color:var(--ink)}
#tabbar svg{width:25px;height:25px}

/* Week */
.components{display:grid;grid-template-columns:auto auto 1fr auto;gap:14px 12px;align-items:center;font-size:14px;margin-top:24px}
.bar{height:6px;background:var(--accentwash);position:relative;min-width:32px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent2)}
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid30 div{aspect-ratio:1;background:var(--accentwash);cursor:pointer}
/* D8.2: shaded by finished sessions, never by minutes; a met-goal week keeps a gold ring and no solid gold. */
.s1{background:color-mix(in srgb,var(--accent2) 35%,transparent)!important}
.s2{background:color-mix(in srgb,var(--accent2) 65%,transparent)!important}
.s3{background:var(--accent2)!important}
.ring{box-shadow:inset 0 0 0 1.5px var(--gold)!important}
.legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--ink3)}
.legend i{width:10px;height:10px;display:inline-block}
.comp{margin-top:18px}
.comp-line{display:grid;grid-template-columns:92px 1fr;gap:12px;font-size:14px;line-height:1.4}
.comp .bar{margin-top:8px}
.you-head{display:flex;gap:16px;align-items:center;margin-top:8px}
.avatar{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--serif);font-size:22px}
.avatar.anon{box-shadow:none;border-radius:0}
.you-row{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;border-bottom:1px solid var(--line);font-size:16px;font-weight:500;text-align:left}
.you-row span:last-child{color:var(--ink2);font-weight:400;font-variant-numeric:tabular-nums}
.you-row:disabled{opacity:1;cursor:default}
.chart text{font-size:10px;fill:var(--ink3);font-family:var(--sans)}

/* Layers */
.layer{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.layer-inner{max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom))}
#sheet{position:fixed;inset:0;z-index:45}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.32)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:10px 24px calc(32px + env(safe-area-inset-bottom));animation:rise var(--screen) ease-out}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 20px}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}

/* Check-in */
.ci{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.ci-viewport{flex:1;overflow:hidden;margin-top:32px;touch-action:pan-y}
.ci-pages{display:flex;height:100%;transition:transform var(--screen) ease-in-out}
.ci-page{flex:0 0 100%;padding-right:1px}
.dots{display:flex;gap:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink2)}

/* The sitting: ignores the theme (UX spec §2) */
#session{position:fixed;inset:0;z-index:60;background:var(--session);opacity:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.end-zone{position:absolute;top:0;left:0;right:0;height:15%;display:flex;align-items:flex-start;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 8px)}
.stop{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;font-size:15px;font-weight:500;color:rgba(255,255,255,.6);font-family:var(--sans)}
.hold{font-size:12px;letter-spacing:.2px;color:var(--session-line);opacity:0;transition:opacity var(--screen) ease-in-out}
.tap-zone{position:absolute;left:0;right:0;bottom:0;height:50%}
.hint{position:absolute;left:24px;bottom:calc(8px + env(safe-area-inset-bottom));height:24px;width:calc(100% - 48px);transition:opacity .9s ease-out}

/* Sit: this week's seven days (C6) */
.strip{display:flex;gap:8px;padding:4px 0 10px}
.strip i{width:20px;height:20px;background:var(--accentwash);display:block}
.strip i.today{box-shadow:inset 0 0 0 1px var(--ink3)}
.change{padding-top:14px}
.change .row{padding-top:4px}

/* The exit panel (C7): readable in an emergency, quiet otherwise */
.exit{position:absolute;left:24px;right:24px;top:15%;bottom:50%;display:flex;flex-direction:column;justify-content:center;gap:18px;opacity:0;transition:opacity var(--screen) ease-in-out;pointer-events:none;color:#9DAAB8;font-family:var(--sans)}
.exit.on{opacity:1;pointer-events:auto}
.exit .t{font-family:var(--serif);font-size:24px;letter-spacing:-.2px}
.exit button{display:block;text-align:left;min-height:44px;color:#9DAAB8;font-size:16px;font-weight:500;width:100%}
.exit small{display:block;font-size:12px;letter-spacing:.2px;color:#65737F;font-weight:400;margin-top:2px}
.exit p{font-size:14px;color:#65737F;line-height:1.45}

/* History (D6.6, D6.7) */
.hist-day{font-size:14px;color:var(--ink2);padding:24px 0 8px;border-bottom:1px solid var(--line)}
.hist-row{display:block;width:100%;text-align:left;min-height:44px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.hist-row:disabled{cursor:default;opacity:1}
.hist-row.focus{background:var(--accentwash);padding-left:8px}

/* What you met (D6.8): everything in ink-2, no arrows, no colour */
.met-head{display:flex;justify-content:space-between;align-items:center}
.met-toggle{display:flex;gap:6px}
.met-toggle button{font-size:12px;color:var(--ink2);padding:4px 8px;border-radius:8px}
.met-toggle button.on{background:var(--accentwash)}
.met-row{display:block;width:100%;text-align:left;padding:8px 0;color:var(--ink2)}
.met-row .line{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;font-size:14px}
.met-row .bar2{height:6px;background:var(--line);position:relative}
.met-row .bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2)}
.met-row .word{font-size:12px;letter-spacing:.2px;margin:4px 0 0 116px}

/* Month x hour map (D6.9) */
.month-head{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.month-head button{width:44px;height:44px;font-size:22px;color:var(--ink2)}
.month-head button:disabled{color:var(--line)}
.map{display:grid;gap:1px;margin-top:8px}
.map .c{height:7px}
.map .c.f{background:var(--accent2)}
.map .c.u{box-shadow:inset 0 0 0 1px var(--accent2)}
.map .h,.map .d{font-size:9px;color:var(--ink3);font-variant-numeric:tabular-nums;line-height:7px;white-space:nowrap}
.map .h{text-align:right;padding-right:4px}
.map .d{line-height:12px;text-align:center;overflow:visible}
.map .today{height:1px;background:var(--line)}

/* Self-test */
.selftest{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;padding:24px;white-space:pre-wrap}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabbar" hidden></nav>
<div id="layer" class="layer" hidden></div>
<div id="sheet" hidden></div>
<div id="session" hidden></div>

<script id="score-js">
/* The Practice Score (PRD §8): the whole-number arithmetic of PracticeScore.swift and compute_week_exact (D3.1).
   No fractional value enters the score. Duration is not an input: nothing here reads a sitting's length. */
var NimittaScore = (function () {
  "use strict";
  var MAX_COUNTED_PER_DAY = 3;

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseDay(s) { var p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n) { var d = parseDay(s); d.setDate(d.getDate() + n); return ymd(d); }
  /** Monday of the week containing the local date `s`. */
  function weekStart(s) { return addDays(s, -((parseDay(s).getDay() + 6) % 7)); }

  /** Sittings dated in [weekStart, weekStart + 7), keeping only the first three per day by start time. */
  function countedSessions(sessions, start) {
    var end = addDays(start, 7), byDay = {}, out = [];
    // A discarded sitting never counts, not even towards the day's three (D5.4).
    sessions.forEach(function (s) { if (s.state !== "discarded" && s.date >= start && s.date < end) (byDay[s.date] = byDay[s.date] || []).push(s); });
    Object.keys(byDay).forEach(function (day) {
      var sorted = byDay[day].slice().sort(function (a, b) { return a.startedAt - b.startedAt; });
      out.push.apply(out, sorted.slice(0, MAX_COUNTED_PER_DAY));
    });
    return out;
  }

  /** The week's behaviour counts. `tapCount` only answers "was there a tap"; how many is never an input. */
  function week(sessions, start, goalDays) {
    var counted = countedSessions(sessions, start);
    var completed = counted.filter(function (s) { return s.state === "completed"; });
    var dates = {};
    completed.forEach(function (s) { dates[s.date] = true; });
    return {
      goalDays: goalDays,
      practiceDays: Object.keys(dates).length,
      started: counted.length,
      completed: completed.length,
      present: completed.filter(function (s) { return s.tapCount > 0; }).length,

    (S.interrupted ? '<p class="caption" style="padding-bottom:6px">That one got interrupted. It still counts as a session you started.</p>' : "") +
    '<div class="row secondary" style="align-items:center;padding:10px 0"><span class="ink2">' + esc(TXT.tapSound) + "</span>" +
    '<button class="switch' + (S.tapSound ? " on" : "") + '" data-action="toggle-sound" role="switch" aria-checked="' + S.tapSound + '" aria-label="' + esc(TXT.tapSound) + '"></button></div>' +
    results + "</div>";
}

/* D6.1: the full date in the user's locale and a clock in its 12/24-hour style, refreshed each minute. */
function dateLine() {
  var now = new Date();
  try {
    return new Intl.DateTimeFormat(undefined, { dateStyle: "full" }).format(now) + " · " + new Intl.DateTimeFormat(undefined, { timeStyle: "short" }).format(now);
  } catch (e) { return now.toLocaleDateString() + " · " + now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
}
setInterval(function () { var el = $("#dateline"); if (el) el.textContent = dateLine(); }, 20000);

/* D6.6, D7.4: "Today · 2 sessions · 1 unfinished". */
function todayLine() {
  var t = today(), list = kept().filter(function (s) { return s.date === t; });
  var unfinished = list.filter(function (s) { return s.state === "incomplete"; }).length;
  if (!list.length) return "Today · no sessions yet";
  return "Today · " + (list.length === 1 ? "1 session" : list.length + " sessions") + (unfinished ? " · " + unfinished + " unfinished" : "");
}

/* PRD §7.9's wording: "Two days left in the week. You set a goal of {n}." */
function daysLeftLine(days) {
  var word = ["One", "Two", "Three", "Four", "Five", "Six", "Seven"][Math.min(Math.max(days, 1), 7) - 1];
  return word + (days === 1 ? " day left in the week." : " days left in the week.") + " You set a goal of " + S.goalDays + ".";
}

/* D8.1: the weekly score in plain sentences, shared by Record and the Practice screen, singular where it applies. */
function showingUpLine(w) {
  var d = w.practiceDays, g = w.goalDays;
  if (d > g) return "You practised on " + d + " days. You planned " + g + ".";   // neutral: the score caps at the goal
  return "You practised on " + d + " of the " + g + (g === 1 ? " day" : " days") + " you planned.";
}
function finishingLine(w) { return "You finished " + w.completed + " of the " + w.started + (w.started === 1 ? " session" : " sessions") + " you started."; }
function noticingLine(w) {
  if (!w.completed) return null;   // never "0 of 0"
  return w.present + " of your " + w.completed + " finished " + (w.completed === 1 ? "session" : "sessions") + " had at least one return.";
}
var SCORE_EXPLANATION = [
  "Your score is out of 100, and it starts again every Monday.",
  "Showing up counts for half — practising on the days you planned.",
  "Finishing counts for 30 — completing the sessions you begin.",
  "Noticing counts for 20 — marking at least one return in a session.",
  "How long you practise never changes your score."
];
function finishedByDay() {
  var n = {};
  kept().forEach(function (s) { if (s.state === "completed") n[s.date] = (n[s.date] || 0) + 1; });
  return n;
}
/* D8.2: "{date}, {n} sessions" / "{date}, no session", with ", goal met" where it applies. */
function dayLabel(d, n, met) {
  var date = Score.parseDay(d).toLocaleDateString("en-GB", { day: "numeric", month: "long" });
  return date + (n === 0 ? ", no session" : n === 1 ? ", 1 session" : ", " + n + " sessions") + (met ? ", goal met" : "");
}

/* C6: "Your week: 60 → 73", with the components that moved, in Record's own sentences (D8.1). */
function renderChange(c) {
  var b = c.before, a = c.after, rows = "";
  function row(name, sentence) { return '<div class="comp-line" style="margin-top:6px"><span>' + name + '</span><span class="ink2">' + esc(sentence) + "</span></div>"; }
  if (b.practiceDays !== a.practiceDays) rows += row("Showing up", showingUpLine(a));
  if (b.completed !== a.completed || b.started !== a.started) rows += row("Finishing", finishingLine(a));
  if ((b.present !== a.present || b.completed !== a.completed) && noticingLine(a)) rows += row("Noticing", noticingLine(a));
  return '<div class="change"><div class="ui num">Your week: ' + Score.score(b) + " → " + Score.score(a) + "</div>" + rows + "</div>";
}

/* C6: this week's seven days, Monday first. Today fills when a sitting is completed; a met goal wears the gold ring. */
function renderStrip(w, t) {
  var ws = Score.weekStart(t), met = w.practiceDays >= S.goalDays, finished = finishedByDay();
  return '<div class="strip">' + [0, 1, 2, 3, 4, 5, 6].map(function (i) {
    var d = Score.addDays(ws, i), n = finished[d] || 0, ring = met && !!w.practiceDates[d];
    var cls = (n ? "s" + Math.min(n, 3) : d === t ? "today" : "") + (ring ? " ring" : "");
    return '<i class="' + cls + '" role="img" aria-label="' + dayLabel(d, n, ring) + '"></i>';
  }).join("") + "</div>";
}

/* Week (UX §7.5): the score with its three components and raw fractions, the 30-day grid, returns per sitting. */
function renderWeek() {
  var t = today(), first = Score.addDays(t, -29);
  if (!kept().length) return '<div class="pad"><h1 class="display">Record</h1></div><div class="empty reading" style="min-height:50vh">Nothing here yet. It starts when you practise.</div>';
  var w = thisWeek(), sc = Score.score(w);
  var goal = Math.max(w.goalDays, 1);
  var adherence = Math.min(w.practiceDays, goal) / goal;           // display only; never an input to the score
  var completion = w.started ? w.completed / w.started : 0;
  var presence = w.completed ? w.present / w.completed : 0;
  function comp(name, sentence, fill) {
    return '<div class="comp"><div class="comp-line"><span>' + name + '</span><span class="ink2">' + esc(sentence) + "</span></div>" +
      '<div class="bar" aria-hidden="true"><i style="width:' + (Math.min(Math.max(fill, 0), 1) * 100).toFixed(1) + '%"></i></div></div>';
  }
  // With nothing started this week there is no number, only one line; with nothing finished, no Noticing row (D8.1).
  var scoreBlock = !w.started
    ? '<p class="reading ink2">Your week starts when you practise.</p>'
    : '<div class="score" id="score" data-target="' + sc + '">' + sc + "</div>" +
      '<div class="secondary ink2" style="margin-top:6px">out of 100 this week</div>' +
      comp("Showing up", showingUpLine(w), adherence) + comp("Finishing", finishingLine(w), completion) +
      (noticingLine(w) ? comp("Noticing", noticingLine(w), presence) : "");
  var cache = {}, finished = finishedByDay();
  var cells = Array.from({ length: 30 }, function (_, i) {
    var d = Score.addDays(first, i), ws = Score.weekStart(d);
    var wk = cache[ws] || (cache[ws] = Score.week(S.sessions, ws, S.goalDays));
    var n = finished[d] || 0, ring = !!wk.practiceDates[d] && wk.practiceDays >= S.goalDays;
    return '<div class="' + (n ? "s" + Math.min(n, 3) : "") + (ring ? " ring" : "") + '" role="button" data-action="grid-day" data-d="' + d + '" aria-label="' + dayLabel(d, n, ring) + '"></div>';
  }).join("");
  var legend = '<div class="legend" aria-label="1 · 2 · 3+ sessions"><i class="s1"></i>1 · <i class="s2"></i>2 · <i class="s3"></i>3+ sessions</div>';
  return '<div class="pad"><h1 class="display" style="margin-bottom:24px">Record</h1>' +
    scoreBlock +
    '<button class="textlink" data-action="score-how" style="color:var(--ink3);margin-top:12px">How is this worked out?</button>' +
    '<div class="hairline" style="margin:32px 0"></div>' + renderWhatYouMet(t) +
    '<div class="hairline" style="margin:32px 0"></div>' +
    '<div class="label">Days practised in the last 30</div><div class="grid30">' + cells + "</div>" + legend +
    '<div class="hairline" style="margin:32px 0"></div>' +
    '<div class="label">Returns per session</div>' + returnsChart(first, t) +
    '<p class="caption" style="margin-top:12px">This is a pattern, not a judgment. More returns is not worse.</p>' +
    '<div class="hairline" style="margin:32px 0"></div>' + renderMonth(t) +
    '<div class="hairline" style="margin:32px 0 8px"></div>' +
    '<button class="today-line" data-action="history-all" style="font-size:16px;color:var(--ink)"><span>History</span><span>›</span></button></div>';
}

/* You (D6.9): the month x hour map, which replaces the C8 year grid and hour view, and the way into History. */
function firstOfMonth(d) { return d.slice(0, 8) + "01"; }
function addMonths(m, n) {
  var p = m.split("-").map(Number), i = p[0] * 12 + (p[1] - 1) + n;
  return Math.floor(i / 12) + "-" + String(i % 12 + 1).padStart(2, "0") + "-01";
}
function monthShown(m, t) { var cur = firstOfMonth(t); return m <= cur && m >= addMonths(cur, -11); }

function monthMap(m, t) {
  var next = addMonths(m, 1), days = [];
  for (var d = m; d < next; d = Score.addDays(d, 1)) days.push(d);
  var index = {}; days.forEach(function (d, i) { index[d] = i; });
  var cells = days.map(function () { return Array.from({ length: 24 }, function () { return { mark: "", id: null }; }); });
  kept().forEach(function (s) {
    var start = new Date(s.startedAt); start.setMinutes(0, 0, 0);
    var end = Math.max(s.endedAt || s.startedAt, s.startedAt + 1000);
    for (var h = start.getTime(); h < end; h += 3600000) {
      var at = new Date(h), i = index[Score.ymd(at)];
      if (i === undefined) continue;
      var cell = cells[i][at.getHours()];
      if (s.state === "completed") { if (cell.mark !== "f") cell.id = s.id; cell.mark = "f"; }
      else if (!cell.mark) { cell.mark = "u"; cell.id = s.id; }
    }
  });
  var inMonth = kept().filter(function (s) { return s.date >= m && s.date < next; });
  var sat = {}; inMonth.forEach(function (s) { if (s.date <= t) sat[s.date] = true; });
  var usual = null;
  if (inMonth.length >= 3) {
    var starts = Array(24).fill(0);
    inMonth.forEach(function (s) { starts[new Date(s.startedAt).getHours()]++; });
    usual = starts.indexOf(Math.max.apply(null, starts));   // the earlier hour on a tie
  }
  return { days: days, cells: cells, inMonth: inMonth, satDays: Object.keys(sat).length,
           dayCount: m === firstOfMonth(t) ? Number(t.slice(8)) : days.length, usual: usual };
}

function renderMonth(t) {
  var m = UI.month || firstOfMonth(t), map = monthMap(m, t), n = map.days.length;
  function two(h) { return String(h).padStart(2, "0"); }
  function hm(ms) { return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  var grid = '<div class="map" style="grid-template-columns:22px repeat(' + n + ',1fr)">';
  for (var h = 0; h < 24; h++) {
    grid += '<span class="h" aria-hidden="true">' + ([0, 6, 12, 18].indexOf(h) >= 0 ? two(h) : "") + "</span>";
    for (var i = 0; i < n; i++) {
      var c = map.cells[i][h];
      grid += '<span class="c ' + c.mark + '"' + (c.id ? ' data-action="map-cell" data-id="' + c.id + '"' : "") + ' aria-hidden="true"></span>';
    }
  }
  grid += "<span></span>" + map.days.map(function (d) { return '<span class="' + (d === t ? "today" : "") + '"></span>'; }).join("");
  grid += "<span></span>" + map.days.map(function (d) {
    var day = Number(d.slice(8)), date = Score.parseDay(d).toLocaleDateString("en-GB", { day: "numeric", month: "long" });
    var sittings = map.inMonth.filter(function (s) { return s.date === d; }).sort(function (a, b) { return a.startedAt - b.startedAt; });
    var label = sittings.length ? date + ": " + sittings.map(function (s) { return "practised " + hm(s.startedAt) + " to " + hm(s.endedAt || s.startedAt); }).join(", ") : date + ": no session";
    return '<span class="d" role="img" aria-label="' + esc(label) + '">' + ([1, 8, 15, 22, 29].indexOf(day) >= 0 ? day : "") + "</span>";
  }).join("") + "</div>";
  var title = Score.parseDay(m).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  return '<div class="month-head" style="margin-top:0"><button data-action="month-prev"' + (monthShown(addMonths(m, -1), t) ? "" : " disabled") + ' aria-label="‹">‹</button>' +
    '<span class="ui">' + esc(title) + '</span><button data-action="month-next"' + (m < firstOfMonth(t) ? "" : " disabled") + ' aria-label="›">›</button></div>' +
    grid +
    '<p class="secondary ink2" style="margin-top:16px">You practised on ' + map.satDays + " of " + map.dayCount + " days this month.</p>" +
    (map.usual === null ? "" : '<p class="secondary ink2" style="margin-top:4px">You most often practise between ' + two(map.usual) + ":00 and " + two(map.usual + 1) + ":00.</p>");
}

/* You (D8.3): the signed-in layout, never a registration form. There is no account on this page, so the sign-in line
   says so, and there is no Sign out or Delete. No lifetime totals of anything. */

/* Export my data (D8.3): everything this page holds, as a JSON file. Discarded sessions are left out, as promised. */
function exportData() {
  var data = {
    exported_at: new Date().toISOString(), version: "web 1",

    about_you: S.about, experience: S.experience === null ? null : EXPERIENCE[S.experience],

/* D3.4: a new weekly goal applies from the next Monday, so no week is scored against a goal not held during it. */
function applyPendingGoal() {
  if (S.pendingGoal && S.pendingFrom && today() >= S.pendingFrom) { S.goalDays = S.pendingGoal; S.pendingGoal = null; S.pendingFrom = null; save(); }
}

/* History (D6.6): sittings by day, newest first. Discarded sittings never appear. */
function historyRow(s) {
  var at = new Date(s.startedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

    (s.state === "completed" ? "Completed" : "Unfinished") + " · " + returns + (s.interval ? " · Interval bell every " + s.interval + " min" : "");
}
function openHistory(focus) {
  var byDay = {};
  kept().forEach(function (s) { (byDay[s.date] = byDay[s.date] || []).push(s); });
  var days = Object.keys(byDay).sort().reverse();

    '<h1 class="title">History</h1><p class="caption" style="margin-top:4px">Length is recorded, but it is never scored.</p>' +
    days.map(function (d) {
      return '<div class="hist-day" id="day-' + d + '">' + esc(Score.parseDay(d).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" })) + "</div>" +
        byDay[d].sort(function (a, b) { return a.startedAt - b.startedAt; }).map(function (s) {
          return '<button class="hist-row' + (focus && focus.id === s.id ? " focus" : "") + '" id="sit-' + s.id + '" data-action="history-sitting" data-id="' + s.id + '"' +
            (s.state === "completed" ? "" : " disabled") + ">" + esc(historyRow(s)) + "</button>";
        }).join("");
    }).join("") + "</div>";
  openLayer(html);
  var target = focus && (focus.id ? $("#sit-" + focus.id) : $("#day-" + focus.day));
  if (target) target.scrollIntoView({ block: focus.id ? "center" : "start" });

  }
}

/* D6.7: a completed sitting's check-in, in the check-in's own wording. */
function openCheckInDetail(s) {
  var answered = s.checkIn ? HINDRANCES.filter(function (h) { var v = s.checkIn[h.key]; return v !== undefined && v !== null; }) : [];

    }).join("") : '<p class="secondary ink2" style="margin-top:16px">No check-in for this session</p>'));

/* What you met (D6.8): a mirror, not a target. Averages 0-3 and one neutral word against the previous period. */
function renderWhatYouMet(t) {

    '<button class="' + (days === 30 ? "on" : "") + '" data-action="met-days" data-v="30">30 days</button></div></div>' +

/* Daily average over completed sittings only; a day with none is a gap, never a zero (D3.8). */
function returnsChart(first, t) {
  var byDay = {};
  S.sessions.forEach(function (s) {
    if (s.state === "completed" && s.date >= first && s.date <= t) (byDay[s.date] = byDay[s.date] || []).push(s.tapCount);
  });
  var pts = Array.from({ length: 30 }, function (_, i) {
    var v = byDay[Score.addDays(first, i)];

  var svg = "";
  [0, top / 2, top].forEach(function (v) {
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + tick(v) + "</text>";
  });
  [0, 7, 14, 21, 28].forEach(function (i) {
    svg += '<text x="' + x(i) + '" y="' + (H - 4) + '" text-anchor="middle">' + Score.parseDay(Score.addDays(first, i)).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + "</text>";
  });

  if (cur.length) segments.push(cur);

    if (seg.length === 1) svg += '<circle cx="' + x(seg[0].i) + '" cy="' + y(seg[0].avg) + '" r="2" fill="var(--accent2)"/>';
    else svg += '<polyline points="' + seg.map(function (p) { return x(p.i).toFixed(1) + "," + y(p.avg).toFixed(1); }).join(" ") + '" fill="none" stroke="var(--accent2)" stroke-width="1"/>';

}

/* Score reveal: a 600ms count-up, 150ms under Reduce Motion (UX §6). */

/* ---------------------------------------------------------------------------------------------------------------

function renderSound(length, level, voice) {

var BELL_SETS = [
  { key: "temple-bowl", label: "Temple bowl", make: {
    opening: function () { return bellBuffer(220); }, closing: function () { return bellBuffer(196); },
    interval: function () { return bellBuffer(330, 2, 0.35, 0.25); } } },
  { key: "small-bell", label: "Small bell", make: {
    opening: function () { return bellBuffer(880, 3, 0.6, 0.45, SMALL_BELL); }, closing: function () { return bellBuffer(784, 3, 0.6, 0.45, SMALL_BELL); },
    interval: function () { return bellBuffer(1175, 1.5, 0.3, 0.22, SMALL_BELL); } } },
  { key: "wooden-clapper", label: "Wooden clapper", make: {

/* ---------------------------------------------------------------------------------------------------------------
   The sitting (UX §7.3, PRD §7.2, D1.2 time away, D1.4 bells, D3/D4.4 checkpoints)
   --------------------------------------------------------------------------------------------------------------- */
var AWAY_ALLOWANCE_MS = 180 * 1000, MINIMUM_STORED_MS = 60 * 1000, CHECKPOINT_MS = 15 * 1000;
var SES = null, wakeLock = null;

async function holdScreenOn() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", function () { wakeLock = null; }); } }
  catch (e) { wakeLock = null; }
}
function releaseScreen() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
var THEMES = [{ key: "sapphire", label: "Sapphire" }, { key: "jade", label: "Jade" }, { key: "onyx", label: "Onyx" }];
function themeName(key) { return (THEMES.filter(function (t) { return t.key === key; })[0] || THEMES[0]).label; }
/* D10.2: the theme applies at once across the page; `fade` cross-fades it over the screen transition. */
var themeFade = null;
function applyTheme(fade) {

    themeFade = setTimeout(function () { root.classList.remove("theming"); }, 400);

}
function setThemeColor(color) {
  document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
    if (!m.dataset.original) m.dataset.original = m.content;
    m.content = color || m.dataset.original;
  });
}

function begin(minutes, practice) {
  if (SES) return;
  unlockAudio();
  holdScreenOn();
  UI.menuOpen = false; closeSheet();
  SES = { id: uuid(), bell: S.bell, phase: "entering", plannedMs: minutes * 60 * 1000, practice: !!practice, taps: [], awayTotal: 0, awayStart: null, lastCheckpoint: 0,
          canDiscard: true, cappedRecorded: false, panelTimer: null, posture: practice ? "sitting" : S.posture,
          interval: !practice && S.interval && intervalAllowed(S.interval, minutes) ? S.interval : null, nextInterval: 0 };
  SES.intervalAt = SES.interval ? intervalOffsetsMs(SES.interval, SES.plannedMs) : [];
  document.documentElement.classList.add("sitting"); setThemeColor("#05080C");
  var layer = $("#session");
  layer.innerHTML = '<div class="end-zone" id="endZone"><span class="stop">Stop</span></div>' +
    '<div class="exit" id="exitPanel" aria-hidden="true"></div>' +
    '<div class="tap-zone" id="tapZone"><svg class="hint" id="hint" viewBox="0 0 342 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 24 Q171 0 342 24" fill="none" stroke="#1A2836" stroke-width="1"/></svg></div>';
  layer.style.transition = "none"; layer.style.opacity = 0; layer.hidden = false;
  // Walking: the phone is held loosely, so everything below the Stop strip takes taps (D6.3).
  if (SES.posture === "walking") $("#tapZone").style.height = "85%";
  bindSessionGestures();
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    layer.style.transition = "opacity " + ms(900) + "ms ease-out"; layer.style.opacity = 1;
  }); });
  setTimeout(startRunning, ms(900));
}

function startRunning() {
  if (!SES || SES.phase !== "entering") return;
  SES.phase = "running"; SES.startedAt = Date.now();
  strike("opening");
  setTimeout(function () { var h = $("#hint"); if (h) h.style.opacity = 0; }, 3000);   // after 3s every visible element is gone
  writeCheckpoint();
  SES.timer = setInterval(tick, 250);
}

function tick() {
  if (!SES || SES.phase !== "running" || document.visibilityState === "hidden") return;
  var now = Date.now();
  if (now - SES.startedAt >= SES.plannedMs) { finish("completed", SES.startedAt + SES.plannedMs); return; }
  // The interval bell: rung on time while the page is visible. One that fell while the page was hidden is skipped,
  // never rung late (D9.7). Never a tap, never scored, nothing on the screen.
  while (SES.nextInterval < SES.intervalAt.length && now - SES.startedAt >= SES.intervalAt[SES.nextInterval]) {
    if (now - SES.startedAt - SES.intervalAt[SES.nextInterval] < 2000) strike("interval");
    SES.nextInterval++;
  }
  if (now - SES.lastCheckpoint >= CHECKPOINT_MS) writeCheckpoint();
}

function bindSessionGestures() {
  var tapZone = $("#tapZone"), endZone = $("#endZone"), panel = $("#exitPanel");
  var layer = $("#session");
  layer.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });   // no zoom, no selection
  layer.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  tapZone.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (!SES || SES.phase !== "running") return;
    var offset = Date.now() - SES.startedAt;
    if (offset < SES.plannedMs) SES.taps.push(offset);
    tapClick();                                          // no visual response at all
    if (SES.taps.length === 1) writeCheckpoint();        // presence rests on the first tap (D4.4)
  });
  // C7: one tap on the top 15% shows End, Discard and Keep going for four seconds.
  endZone.addEventListener("pointerup", function (e) { e.preventDefault(); revealExitPanel(); });
  // The session layer suppresses clicks, so the panel acts on pointerup.
  panel.addEventListener("pointerup", function (e) {
    var b = e.target.closest("[data-exit]");
    if (!b || !SES || SES.phase !== "running") return;
    e.preventDefault();
    var choice = b.dataset.exit;
    if (choice === "keep") hideExitPanel();
    else if (choice === "end") finish("ended", Date.now());
    else if (choice === "discard") finish(SES.canDiscard ? "discarded" : "ended", Date.now());
  });
}

function revealExitPanel() {
  if (!SES || SES.phase !== "running") return;
  var week = Score.weekStart(today()), panel = $("#exitPanel");
  SES.canDiscard = discardsUsed(week) < DISCARDS_PER_WEEK;
  if (!SES.canDiscard && !SES.cappedRecorded && !SES.practice) {
    S.discards.push({ at: Date.now(), week: week, capped: true });   // so we can see whether the cap is ever reached
    SES.cappedRecorded = true; save();
  }
  panel.innerHTML = '<div class="t">End this session?</div>' +
    '<button data-exit="end">End<small>keeps it as an unfinished session</small></button>' +
    (SES.canDiscard ? '<button data-exit="discard">Discard<small>removes it completely</small></button>'
      : "<p>You have used your three discards this week. Ending now will save this as an unfinished session.</p>") +
    '<button data-exit="keep">Keep going</button>';

}
function hideExitPanel() {
  var panel = $("#exitPanel"); if (!panel) return;
  panel.classList.remove("on"); panel.setAttribute("aria-hidden", "true");
  if (SES) clearTimeout(SES.panelTimer);
}

/* Time away (D1.2): 180 s in total per sitting. Ending for time away dates the end to the moment the page was left. */
document.addEventListener("visibilitychange", function () {
  if (!SES || SES.phase !== "running") return;
  var now = Date.now();
  if (document.visibilityState === "hidden") {
    SES.awayStart = now;
    writeCheckpoint();
    return;
  }

  holdScreenOn();

  var left = SES.awayStart, plannedEnd = SES.startedAt + SES.plannedMs;
  var allowanceRanOut = left + (AWAY_ALLOWANCE_MS - SES.awayTotal);
  if (now > allowanceRanOut && allowanceRanOut < plannedEnd) { finish("away", left); return; }
  SES.awayTotal += Math.min(now, plannedEnd) - left;
  SES.awayStart = null;
  if (now >= plannedEnd) finish("completed", plannedEnd);
});
window.addEventListener("pagehide", function () { if (SES && SES.phase === "running") writeCheckpoint(); });

function writeCheckpoint() {
  if (!SES || SES.practice || SES.phase !== "running") return;
  var now = Date.now();
  SES.lastCheckpoint = now;
  S.checkpoint = { id: SES.id, startedAt: SES.startedAt, plannedMs: SES.plannedMs, taps: SES.taps.slice(), posture: SES.posture, interval: SES.interval,
    lastKnownAt: SES.awayStart !== null ? SES.awayStart : now, awayTotal: SES.awayTotal, awayStart: SES.awayStart };
  save();
}

function record(id, startedAt, plannedMs, taps, elapsedMs, state, ending, posture, interval) {
  var recorded = Math.min(elapsedMs, plannedMs), endedAt = startedAt + recorded;
  var kept = taps.filter(function (t) { return t <= recorded; });
  return { id: id, date: Score.ymd(new Date(endedAt)), startedAt: startedAt, endedAt: endedAt,
    plannedSeconds: Math.round(plannedMs / 1000), actualSeconds: Math.floor(recorded / 1000),
    state: state, ending: ending, taps: kept, tapCount: kept.length, checkIn: null, posture: posture || "sitting", interval: interval || null };
}

function finish(reason, endedAt) {

  var state = reason === "completed" ? "completed" : elapsed < MINIMUM_STORED_MS ? null : reason === "discarded" ? "discarded" : "incomplete";

  if (reason === "completed" || reason === "ended") strike("closing");

  var stored = null, wasPractice = SES.practice;

    // Kept on the phone to count against the cap, in no ratio, never in the results as a sitting (D5.4). Under 60 s it
    // is not stored either way and costs no discard.
    if (state === "discarded") S.discards.push({ at: Date.now(), week: Score.weekStart(today()), capped: false });
    S.interrupted = reason === "away" && !!stored;

  var layer = $("#session"), fade = reason === "away" ? 0 : ms(1400);

  setTimeout(function () {

/* A page closed mid-sitting: stored as incomplete, ending at the last known moment (D3), like the app's recovery. */
function recoverCheckpoint() {

  var elapsed = endAt - c.startedAt;
  if (elapsed >= MINIMUM_STORED_MS && !S.sessions.some(function (s) { return s.id === c.id; })) {
    S.sessions.push(record(c.id, c.startedAt, c.plannedMs, c.taps || [], elapsed, "incomplete", "closed", c.posture, c.interval));
    S.interrupted = true;

/* ---------------------------------------------------------------------------------------------------------------

   --------------------------------------------------------------------------------------------------------------- */
var CI = null;
function openCheckIn(sessionId) {

    '<div class="row"><h1 class="title">How was the session?</h1><button class="secondary ink3" data-action="ci-skip" style="flex:none">Skip the rest</button></div>' +
    '<p class="caption" style="margin-top:4px">No right answers. This never affects your ranking.</p>' +
    '<div class="ci-viewport" id="ciViewport"><div class="ci-pages" id="ciPages">' +
    HINDRANCES.map(function (h) {
      return '<div class="ci-page"><h2 class="title">' + h.name + '</h2><p class="reading" style="margin-top:8px">' + esc(h.q) + '</p>' +
        '<div class="options" style="margin-top:24px">' + ANSWERS.map(function (a, v) {
          return '<button data-action="ci-answer" data-h="' + h.key + '" data-v="' + v + '"><span class="radio"></span>' + a + "</button>";
        }).join("") + "</div></div>";
    }).join("") + "</div></div>" +
    '<div class="row" style="align-items:center;padding-top:16px"><div class="dots" id="ciDots">' +
    HINDRANCES.map(function (_, i) { return '<i class="' + (i === 0 ? "on" : "") + '"></i>'; }).join("") +
    '</div><button class="textlink" data-action="ci-what">What is this? →</button></div></div>');
  bindCheckInSwipe();
}
function showCheckInPage(i) {
  CI.index = Math.max(0, Math.min(4, i));
  var pages = $("#ciPages");
  pages.style.transitionDuration = ""; pages.style.transform = "translateX(" + (-100 * CI.index) + "%)";
  Array.prototype.forEach.call($("#ciDots").children, function (d, n) { d.classList.toggle("on", n === CI.index); });
}
function bindCheckInSwipe() {
  var vp = $("#ciViewport"), pages = $("#ciPages"), x0 = null, dx = 0;
  vp.addEventListener("pointerdown", function (e) { x0 = e.clientX; dx = 0; });
  vp.addEventListener("pointermove", function (e) {
    if (x0 === null) return;
    dx = e.clientX - x0;
    if (Math.abs(dx) > 8) { pages.style.transitionDuration = "0ms"; pages.style.transform = "translateX(calc(" + (-100 * CI.index) + "% + " + dx + "px))"; }
  });
  function up() { if (x0 === null) return; var moved = dx; x0 = null; showCheckInPage(Math.abs(moved) > 60 ? CI.index + (moved < 0 ? 1 : -1) : CI.index); }
  vp.addEventListener("pointerup", up); vp.addEventListener("pointercancel", up); vp.addEventListener("pointerleave", up);
}
function answerCheckIn(key, value) {
  if (!CI || CI.done) return;
  CI.answers[key] = value;
  var at = HINDRANCES.findIndex(function (h) { return h.key === key; });
  Array.prototype.forEach.call($("#ciPages").children[at].querySelectorAll("[data-action=ci-answer]"), function (b) {
    b.classList.toggle("on", Number(b.dataset.v) === value);
  });
  setTimeout(function () { if (CI && !CI.done) { if (at < 4) showCheckInPage(at + 1); else finishCheckIn(); } }, 220);
}
function finishCheckIn() {
  if (!CI || CI.done) return;
  CI.done = true;
  var s = S.sessions.find(function (x) { return x.id === CI.id; });
  if (s && Object.keys(CI.answers).length) { s.checkIn = Object.assign({}, CI.answers); s.checkInAt = Date.now(); }
  S.pendingCheckIn = null;
  CI = null;
  save();
  closeLayer(); closeSheet();
  UI.tab = "sit"; render();
  if (completedCount() >= 5 && !S.survey) openSurvey();   // after the fifth completed sitting
}

/* ---------------------------------------------------------------------------------------------------------------
   Phase 0 questions and the results block
   --------------------------------------------------------------------------------------------------------------- */
function openSurvey() {
  if (!S.survey) { S.survey = { answers: [null, null, null], notes: "", shownAt: Date.now() }; save(); }
  var sv = S.survey;
  openLayer('<div class="layer-inner">' +
    '<button class="back" data-action="close-survey" aria-label="Back">' + ICON.back + "</button>" +
    SURVEY.map(function (q, i) {
      return '<p class="reading" style="margin-top:' + (i ? 32 : 16) + 'px">' + (i + 1) + ". " + esc(q) + "</p>" +
        '<div class="options" style="margin-top:12px">' + ANSWERS.map(function (a, v) {
          return '<button class="' + (sv.answers[i] === v ? "on" : "") + '" data-action="survey-answer" data-q="' + i + '" data-v="' + v + '"><span class="radio"></span>' + a + "</button>";
        }).join("") + "</div>";
    }).join("") +
    '<div class="label" style="margin-top:32px">Anything else?</div><textarea class="field" id="survey-notes">' + esc(sv.notes) + "</textarea>" +
    '<button class="primary" data-action="copy-results" id="copyButton" style="margin-top:32px">Copy my results</button>' +
    '<p class="reading" style="margin-top:16px;font-size:17px">' + esc(TXT.pasteBack) + "</p>" +
    '<div id="copyFallback" hidden><p class="caption" style="margin-top:16px">' + esc(TXT.copyByHand) + '</p><textarea class="field" id="resultsText" style="height:220px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea></div>' +
    "</div>");
}

function resultsText() {
  function clock(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function time(t) { var d = new Date(t); return Score.ymd(d) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  var device = /iPhone|iPad|iPod/.test(navigator.userAgent) ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : "other";
  var sessions = kept().sort(function (a, b) { return a.startedAt - b.startedAt; });
  var completed = sessions.filter(function (s) { return s.state === "completed"; }).length;
  var lines = [
    "Nimitta Phase 0 results",
    "tester " + S.tester + " · web 1 · " + device + " · wake lock " + ("wakeLock" in navigator ? "yes" : "no") + " · tap sound " + (S.tapSound ? "on" : "off"),
    "goal " + S.goalDays + " days a week, " + S.goalMinutes + " min · experience: " + (S.experience === null ? "-" : EXPERIENCE[S.experience]),
    "",
    "Sessions: " + sessions.length + " (" + completed + " completed)"
  ];
  sessions.forEach(function (s, n) {
    lines.push((n + 1) + ". " + time(s.startedAt) + " · " + (s.posture || "sitting") + " · planned " + Math.round(s.plannedSeconds / 60) + " min · sat " + clock(s.actualSeconds * 1000) +
      " · " + s.state + (s.ending && s.ending !== "completed" ? " (" + { held: "held to end", ended: "ended", away: "away too long", closed: "page closed" }[s.ending] + ")" : "") +
      (s.interval ? " · interval bell every " + s.interval + " min" : "") + " · " + s.tapCount + (s.tapCount === 1 ? " tap" : " taps") + (s.taps.length ? " at " + s.taps.map(clock).join(" ") : ""));
    if (s.checkIn) lines.push("   check-in: " + HINDRANCES.map(function (h) { var v = s.checkIn[h.key]; return h.name + " " + (v === undefined || v === null ? "-" : ANSWERS[v]); }).join(", "));
    else if (s.state === "completed") lines.push("   check-in: skipped");
  });
  var used = S.discards.filter(function (d) { return !d.capped; }).length, capped = S.discards.length - used;
  lines.push("Discards: " + used + " · stopped by the weekly limit: " + capped);
  var sv = S.survey || { answers: [null, null, null], notes: "" };
  lines.push("", "Questions");
  SURVEY.forEach(function (q, i) { lines.push((i + 1) + ". " + q + " " + (sv.answers[i] === null ? "-" : ANSWERS[sv.answers[i]])); });
  lines.push("Anything else? " + (sv.notes.trim() ? sv.notes.trim().replace(/\s*\n\s*/g, " / ") : "-"));
  lines.push("This week's score: " + Score.score(thisWeek()));
  return lines.join("\n");
}

function copyResults() {
  var notes = $("#survey-notes"); if (notes && S.survey) { S.survey.notes = notes.value; save(); }
  var text = resultsText(), button = $("#copyButton");
  function done() { button.textContent = TXT.copied; }
  function fallback() {
    var box = $("#resultsText"); $("#copyFallback").hidden = false; box.value = text;
    box.focus(); box.select(); box.setSelectionRange(0, text.length);
    try { if (document.execCommand("copy")) done(); } catch (e) {}
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

/* ---------------------------------------------------------------------------------------------------------------
   Actions
   --------------------------------------------------------------------------------------------------------------- */
var actions = {

    d.name = $("#about-name").value.trim();

  "onb-len": function (el) { S.goalMinutes = Number(el.dataset.v); UI.customOpen = false; UI.customError = false; save(); render(); },
  "onb-custom": function () { UI.customOpen = true; UI.customError = false; UI.customText = LENGTHS.indexOf(S.goalMinutes) < 0 ? String(S.goalMinutes) : ""; render(); var f = $("#onb-custom"); if (f) f.focus(); },
  "custom-sheet": function (el) {

    openSheet('<div class="row" style="justify-content:flex-start;align-items:center;gap:12px"><input class="field" id="sit-custom" inputmode="numeric" maxlength="3" style="width:96px" value="' + (UI.customScope === "goal" ? S.goalMinutes : UI.sittingMinutes || S.goalMinutes) + '"><span class="secondary ink2">minutes</span></div>' +

  },
  "score-how": function () { openSheet(SCORE_EXPLANATION.map(function (l, i) { return '<p class="reading"' + (i ? ' style="margin-top:12px"' : "") + ">" + esc(l) + "</p>"; }).join("")); },
  "grid-day": function (el) { openHistory({ day: el.dataset.d }); },
  "you-sheet-goal": function () { youSheet("goal"); },
  "you-sheet-length": function () { youSheet("length"); },
  "you-sheet-posture": function () { youSheet("posture"); },
  "you-sheet-about": function () { youSheet("about"); },
  "you-posture": function (el) { S.posture = el.dataset.v; save(); render(); youSheet("posture"); },
  "you-sheet-theme": function () { youSheet("theme"); },
  "you-sheet-bell": function () { youSheet("bell"); },
  "you-theme": function (el) { S.theme = el.dataset.v; save(); applyTheme(true); render(); youSheet("theme"); },
  "you-bell": function (el) {
    S.bell = el.dataset.v; save(); render(); youSheet("bell");
    unlockAudio(); strike("opening");   // each choice plays its opening sound once (D10.1)
  },
  "you-research": function () {
    if (S.about.age === UNDER_18) return;   // never set for someone under 18 (D5.1)
    S.about.consent = !S.about.consent; S.about.consentUpdatedAt = new Date().toISOString(); save(); render();
  },
  "you-export": function () { exportData(); },
  "you-pick": function (el) {
    var f = el.dataset.f, v = el.dataset.v;
    if (f === "age" && v === UNDER_18) {
      S.about = { name: "", age: UNDER_18, gender: null, genderSelf: "", work: null, consent: false, consentUpdatedAt: null };
    } else {
      if (S.about.age === UNDER_18 && f !== "age") return;   // nothing else is kept for someone under 18
      S.about[f] = S.about[f] === v ? null : v;
      if (f === "gender" && S.about.gender !== SELF_DESCRIBE) S.about.genderSelf = "";
    }
    save(); var y = window.scrollY; render(); window.scrollTo(0, y); if (UI.youSheet === "about") youSheet("about");
  },
  "you-goal": function (el) {

    if (n === S.goalDays) { S.pendingGoal = null; S.pendingFrom = null; }

    save(); render(); youSheet("goal");
  },
  "you-length": function (el) { S.goalMinutes = Number(el.dataset.v); save(); render(); youSheet("length"); },
  "interval-sheet": function () {
    var minutes = UI.sittingMinutes || S.goalMinutes, anyDisabled = false;
    var rows = [null].concat(INTERVALS).map(function (n) {
      var ok = n === null || intervalAllowed(n, minutes);
      if (!ok) anyDisabled = true;

    }).join("");

  },

  "posture": function (el) { S.posture = el.dataset.v; save(); render(); },
  "history-today": function () { openHistory({ day: today() }); },
  "history-all": function () { openHistory(null); },
  "history-sitting": function (el) { var s = S.sessions.filter(function (x) { return x.id === el.dataset.id; })[0]; if (s && s.state === "completed") openCheckInDetail(s); },
  "close-history": function () { closeLayer(); closeSheet(); render(); },
  "map-cell": function (el) { openHistory({ id: el.dataset.id }); },
  "month-prev": function () { var t = today(), m = addMonths(UI.month || firstOfMonth(t), -1); if (monthShown(m, t)) { UI.month = m; render(); } },
  "month-next": function () { var t = today(), m = addMonths(UI.month || firstOfMonth(t), 1); if (m <= firstOfMonth(t)) { UI.month = m === firstOfMonth(t) ? null : m; render(); } },
  "met-days": function (el) { UI.metDays = Number(el.dataset.v); render(); },
  "met-open": function (el) { var h = HINDRANCES.filter(function (x) { return x.key === el.dataset.h; })[0]; openSheet('<h2 class="title">' + h.name + '</h2><p class="reading" style="margin-top:12px">' + esc(INSTRUCTIONS[h.key]) + "</p>"); },
  "onb-try": function () { begin(1, true); },
  "onb-finish": function () {
    var t = $("#onb-time"); if (t && t.value) S.reminder = t.value;
    S.onboarded = true; UI.tab = "sit"; save(); render();
    openSheet('<p class="reading">' + esc(TXT.storageWarning) + '</p><button class="primary" data-action="close-sheet" style="margin-top:24px">Continue</button>');
  },

  "ci-answer": function (el) { answerCheckIn(el.dataset.h, Number(el.dataset.v)); },

  "ci-what": function () { openSheet(WHAT_IS_THIS); },

  "survey": function () { openSurvey(); },
  "survey-answer": function (el) {
    var q = Number(el.dataset.q), v = Number(el.dataset.v);
    S.survey.answers[q] = v; save();
    Array.prototype.forEach.call(document.querySelectorAll('[data-action=survey-answer][data-q="' + q + '"]'), function (b) { b.classList.toggle("on", Number(b.dataset.v) === v); });
  },

  "close-survey": function () { var n = $("#survey-notes"); if (n && S.survey) { S.survey.notes = n.value; save(); } closeLayer(); render(); }

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (el) { var f = actions[el.dataset.action]; if (f) f(el, e); return; }
  if (UI.menuOpen && !e.target.closest(".menu")) { UI.menuOpen = false; render(); }
});
document.addEventListener("input", function (e) {
  if (e.target.id === "survey-notes" && S.survey) { S.survey.notes = e.target.value; save(); }
  if (e.target.id === "you-name" && S.about.age !== UNDER_18) { S.about.name = e.target.value.slice(0, 40); save(); render(); }
  if (e.target.id === "you-self") { S.about.genderSelf = e.target.value.slice(0, 60); save(); }
});
document.addEventListener("change", function (e) {
  if (e.target.id === "you-consent") {
    if (S.about.age === UNDER_18) { e.target.checked = false; return; }   // never set for someone under 18 (D5.1)
    S.about.consent = e.target.checked; S.about.consentUpdatedAt = new Date().toISOString(); save(); render();
  }
});

/* ---------------------------------------------------------------------------------------------------------------
   ?selftest=1: the score against the shared 20-week fixture, the same assertions as PracticeScoreFixtureTests.swift
   --------------------------------------------------------------------------------------------------------------- */
function runSelfTest() {
  var fixture = JSON.parse($("#score-fixture").textContent), out = [], failures = 0, halves = 0;
  fixture.weeks.forEach(function (week) {
    var sessions = week.sessions.map(function (s) {
      return { date: s.local_date, startedAt: Date.parse(s.started_at), state: s.state, tapCount: s.tap_count };
    });
    var w = Score.week(sessions, week.week_start, week.goal_days), got = Score.score(w), e = week.expected;
    var ok = w.practiceDays === e.practice_days && w.started === e.started && w.completed === e.completed && w.present === e.present && got === e.score;
    var t = Score.exactTotal(w), twice = 2 * t.numerator;
    if (twice % t.denominator === 0 && (twice / t.denominator) % 2 === 1) { halves++; if (got !== (twice / t.denominator + 1) / 2) ok = false; }
    if (!ok) failures++;
    out.push((ok ? "ok   " : "FAIL ") + got + " (expected " + e.score + ")  " + week.name);
  });
  var pass = failures === 0 && fixture.weeks.length === 20 && halves >= 3;
  out.unshift((pass ? "PASS" : "FAIL") + ": " + (fixture.weeks.length - failures) + " of " + fixture.weeks.length + " weeks match the app; " + halves + " land exactly on .5 and round up", "");
  return { pass: pass, text: out.join("\n") };
}

/* ---------------------------------------------------------------------------------------------------------------
   Start
   --------------------------------------------------------------------------------------------------------------- */
if (params.get("selftest") === "1") {
  var result = runSelfTest();
  document.title = (result.pass ? "PASS" : "FAIL") + " · Nimitta self-test";
  $("#app").innerHTML = '<pre class="selftest">' + esc(result.text) + "</pre>";
} else {
  S = loadState();
  if (!S.createdAt || S.sessions.some(function (x) { return x.startedAt < S.createdAt; })) {
    S.createdAt = Math.min.apply(null, [S.createdAt || Date.now()].concat(S.sessions.map(function (x) { return x.startedAt; }))); save();
  }
  applyPendingGoal();
  applyTheme(false);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && S && !SES) { var before = S.goalDays; applyPendingGoal(); if (S.goalDays !== before) render(); } });
  recoverCheckpoint();
  if (S.step === 2 && !UI.draftAbout) UI.draftAbout = Object.assign({}, S.about);
  render();
  if (S.pendingCheckIn && S.sessions.some(function (s) { return s.id === S.pendingCheckIn && !s.checkIn; })) openCheckIn(S.pendingCheckIn);
  else if (S.onboarded && !S.warned) actions["onb-finish"].call(null);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
}
